name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
env:
  SITE_URL: ${{ vars.SITE_URL }}   # repo Settings > Variables > SITE_URL = https://yoursite.pages.dev
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Safety check - banned models must not exist
        run: |
          for m in bmw golf mustang idbuzz tanker; do
            if ls assets/$m.glb assets_lite/$m.glb 2>/dev/null; then echo "BANNED MODEL $m FOUND"; exit 1; fi
          done
      - run: |
          test -n "$SITE_URL" || { echo "SITE_URL variable missing"; exit 1; }
          sed -i "s#https://YOUR-SITE.pages.dev#$SITE_URL#" capacitor.config.json
          mkdir -p www && echo '<!doctype html><meta charset=utf-8><body style="background:#000;color:#fff;font:20px sans-serif;text-align:center;padding-top:30vh">Loco n Drive 3D - internet needed on first launch</body>' > www/index.html
          npm install
          npx cap add android
          mkdir -p android/app/src/main/assets/local
          for d in assets assets_lite sounds lib; do [ -d "$d" ] && cp -r "$d" android/app/src/main/assets/local/ ; done
          cp apk-native/MainActivity.java android/app/src/main/java/com/roadready/app/MainActivity.java
          npx capacitor-assets generate --android --iconBackgroundColor '#0b1d3a' --splashBackgroundColor '#0b1d3a'
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: loco-n-drive-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
