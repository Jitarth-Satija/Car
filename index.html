<script>
/* ===== Auto fullscreen: ON while playing/menus, OFF only while paused (Esc / controller Pause) ===== */
(function(){
const d=document,root=d.documentElement;
const inFS=()=>!!(d.fullscreenElement||d.webkitFullscreenElement);
const isPaused=()=>{try{return !!(run&&paused)}catch(e){return false}};
let ownExit=0,lastP=false;
function kbLock(on){try{if(navigator.keyboard){on?navigator.keyboard.lock(['Escape']).catch(()=>{}):navigator.keyboard.unlock()}}catch(e){}}
function enter(){
 if(inFS()||isPaused())return;
 try{
  const f=root.requestFullscreen?root.requestFullscreen({navigationUI:'hide'}):root.webkitRequestFullscreen?root.webkitRequestFullscreen():null;
  if(f&&f.then)f.then(()=>{kbLock(true);try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{});
  else kbLock(true);
 }catch(e){}
}
function leave(){
 if(!inFS())return;
 ownExit=1;kbLock(false);
 try{(d.exitFullscreen?d.exitFullscreen():d.webkitExitFullscreen&&d.webkitExitFullscreen())}catch(e){}
 setTimeout(()=>{ownExit=0},600);
}
/* first touch / click / key (Esc excluded) on any device -> fullscreen */
['pointerdown','touchend','mousedown','click','keydown'].forEach(ev=>addEventListener(ev,e=>{
 if(ev=='keydown'&&e.key=='Escape')return;
 enter();
},true));
/* pause <-> fullscreen sync */
setInterval(()=>{
 const p=isPaused();
 if(p!==lastP){lastP=p;if(p)leave();else enter()}
},100);
/* fullscreen was left by the browser itself (e.g. Esc without keyboard lock) while playing -> treat as pause */
function onFS(){
 if(inFS()){kbLock(true);return}
 kbLock(false);
 if(ownExit)return;
 try{if(run&&!paused&&typeof help=='function')help()}catch(e){}
}
d.addEventListener('fullscreenchange',onFS);d.addEventListener('webkitfullscreenchange',onFS);
})();
</script>
